name: Desktop and Android apps

# Every push that touches the app: test, build and smoke-test on Windows, macOS and Linux, and
# build the Android app (mobile/) after checking its JavaScript backend against the Python one.
# A GitHub Release with the packages is published either by pushing a version tag
# (v1.2.3, must match backend/version.py) or by running this workflow by hand on main with
# "release" ticked, which tags the version in backend/version.py itself.
on:
  push:
    # A push trigger that lists only tags would stop running for branches, so name both.
    branches: ["**"]
    tags: ["v*"]
    paths: # not applied to tag pushes
      - "backend/**"
      - "frontend/web/**"
      - "desktop/**"
      - "tests/**"
      - "requirements-desktop.txt"
      - "mobile/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of the version in backend/version.py (main only)"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python desktop/release.py check-tag "$GITHUB_REF_NAME"

      - name: Install
        run: pip install -r requirements-desktop.txt pytest httpx

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: pyinstaller desktop/research_radar.spec --noconfirm

      - name: Smoke test the built app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe="dist/ResearchRadar/ResearchRadar.exe" ;;
            macOS)   exe="dist/Research Radar.app/Contents/MacOS/ResearchRadar" ;;
            *)       exe="dist/ResearchRadar/ResearchRadar" ;;
          esac
          python desktop/smoke.py "$exe"

      - name: Package
        shell: bash
        run: |
          version="$(python desktop/release.py version)"
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip "../out/ResearchRadar-$version-windows.zip" ResearchRadar > /dev/null) ;;
            macOS)   ditto -c -k --keepParent "dist/Research Radar.app" "out/ResearchRadar-$version-macos.zip" ;;
            *)       tar -czf "out/ResearchRadar-$version-linux.tar.gz" -C dist ResearchRadar ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ResearchRadar-${{ runner.os }}
          path: out/*
          retention-days: 30

  android:
    name: android
    runs-on: ubuntu-latest
    env:
      RADAR_REQUIRE_NODE: "1" # the JavaScript parity tests must run here, not be skipped
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test the JavaScript backend
        run: |
          pip install -r requirements.txt pytest httpx
          node --test tests/js/*.test.mjs
          python -m pytest -q tests/test_js_core.py

      - name: Build the web content
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: building a debug APK only (not attached to releases)"
          fi

      - name: Build the APK
        working-directory: mobile/android
        env:
          RADAR_KEYSTORE: ${{ steps.key.outputs.path }}
          RADAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RADAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="$(python3 ../../desktop/release.py version)"
          mkdir -p ../../out ../../debug
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../../debug/ResearchRadar-$version-android-debug.apk"
          if [ -n "$RADAR_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../../out/ResearchRadar-$version-android.apk"
          fi
          ls -lh ../../out ../../debug

      # for trying a build on a phone; it has a throwaway signature, so it can't update a release install
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: debug/*
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ResearchRadar-Android
          path: out/*
          retention-days: 30
          if-no-files-found: ignore

  release:
    name: Publish release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [build, android] # only when every build and check passed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 desktop/release.py version)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag is already released; raise __version__ in backend/version.py first"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: ResearchRadar-* # not the debug APK
          merge-multiple: true

      - name: Android APK present when the README promises it
        run: |
          version="$(python3 desktop/release.py version)"
          if grep -q "ResearchRadar-$version-android.apk" README.md && [ ! -f "release/ResearchRadar-$version-android.apk" ]; then
            echo "::error::README links ResearchRadar-$version-android.apk but no signed APK was built. Add the ANDROID_KEYSTORE_* secrets (README, Android app build) or drop the Android link."
            exit 1
          fi

      - name: Checksums
        working-directory: release
        run: |
          sha256sum ResearchRadar-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          android=""
          if ls release/*-android.apk > /dev/null 2>&1; then android="--android"; fi
          python3 desktop/release.py notes "${{ steps.tag.outputs.tag }}" $android > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }} # creates the tag here when run by hand
          name: Research Radar ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true # appends the merged PRs since the previous release
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release/*
          fail_on_unmatched_files: true
