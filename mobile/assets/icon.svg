  <rect width="108" height="108" fill="#0e1015"/>
  <circle cx="31" cy="54" r="14" fill="url(#g)"/>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M31 54 C42 54 42 37 53 37 H78" stroke="#3987e5"/>
    <path d="M31 54 H80" stroke="#d95926"/>
    <path d="M31 54 C42 54 42 71 53 71 H78" stroke="#199e70"/>
  </g>
  <g stroke="#0e1015" stroke-width="1.5">
    <circle cx="61" cy="37" r="4.5" fill="#3987e5"/><circle cx="73" cy="37" r="3.5" fill="#3987e5"/>
    <circle cx="56" cy="54" r="5" fill="#d95926"/><circle cx="70" cy="54" r="3.5" fill="#d95926"/>
    <circle cx="64" cy="71" r="4.5" fill="#199e70"/>
